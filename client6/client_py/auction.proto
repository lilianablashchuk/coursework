syntax = "proto3";

package auction;


message Bid {
    string user = 1;
    double amount = 2;
    string time = 3;
}

message AuctionLot {
    int32 id = 1;
    string title = 2;
    string description = 3;  
    string creator = 4;      
    string createdAt = 5;    
    double startingPrice = 6;
    string imagePath = 7;    
    string startTime = 8;    
    int32 durationMinutes = 9;
    repeated Bid bids = 10;
    
    int32 usersPresent = 11; 
    
    string status = 12;      
}

message AuctionLots {
    repeated AuctionLot lots = 1;
}

message UserBidInfo {
    int32 lotId = 1;
    string lotTitle = 2;
    double amount = 3;
    string time = 4;
}

message BidsList {
    repeated UserBidInfo bids = 1;
}

message WinningLotInfo {
    int32 lotId = 1;
    string lotTitle = 2;
    double winningAmount = 3;
}

message WinningsList {
    repeated WinningLotInfo winnings = 1;
}

message Empty {}


message CreateLotRequest {
    string title = 1;
    string description = 2;
    string creator = 3;      
    double startingPrice = 4;
    string startTime = 5;      
    int32 durationMinutes = 6;
}

message PlaceBidRequest {
    int32 lotId = 1;
    string user = 2;              
    double amount = 3;
}

message LotIdUserRequest {
    int32 lotId = 1;
    string username = 2;
}

message DeleteLotRequest {
    int32 lotId = 1;
    string deleterUsername = 2; 
}

message DeleteLotResponse {
    string status = 1;
    string message = 2;
}

message GetLotStatusRequest {
    int32 lotId = 1;
}

message LotStatusResponse {
    string status = 1;           
    string message = 2;
    string lotTitle = 3;
    double finalPrice = 4;     
    string winner = 5;           
    string createdAt = 6;
}


message UserRequest {
    string username = 1;
}

message AuthRequest {
    string username = 1;
    string password = 2;
}

message AuthResponse {
    string status = 1;
    string message = 2;
    string user = 3;
    optional string userId = 4;
}



service AuctionService {

    rpc GetAuctions(Empty) returns (AuctionLots);
    rpc CreateLot(CreateLotRequest) returns (AuctionLot);
    rpc PlaceBid(PlaceBidRequest) returns (AuctionLot);
    rpc DeleteLot (DeleteLotRequest) returns (DeleteLotResponse);
    rpc GetLotStatus (GetLotStatusRequest) returns (LotStatusResponse);

    rpc JoinAuction (LotIdUserRequest) returns (Empty);
    rpc LeaveAuction (LotIdUserRequest) returns (Empty);
    
    rpc GetWinningsByUser(UserRequest) returns (WinningsList);

    rpc Register(AuthRequest) returns (AuthResponse);
    rpc Login(AuthRequest) returns (AuthResponse);
    rpc GetBidsByUser(UserRequest) returns (BidsList);
}
